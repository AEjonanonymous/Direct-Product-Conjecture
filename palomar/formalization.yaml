project:
  name: "DirectProductConjecture"
  description: "Formalization of the macro-deductive inequality chain establishing the direct product lower bound via arithmetic aggregation and modular reduction."
  authors:
    - name: "Jonathan f(n) Reed"
      orcid: "0009-0008-7345-1407"
  responsible_maintainers:
    - name: "Jonathan f(n) Reed"
      orcid: "0009-0008-7345-1407"
  license: "AGPL-3.0"

