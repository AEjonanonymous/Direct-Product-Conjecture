limitations:
  - "Formalizes the macro-deductive inequality chain and arithmetic aggregation steps conditional on established structural premises and bounds."
  - "Quantifies the drift and slack parameter o_k as a fixed real scalar per index k."

automation:
  methods:
    - method: "ai-assisted"
      tool_setup: "Gemini under direct human control"

review:
  status: "unchecked"
  basis: "Mechanical verification executed via Lean 4 kernel and NanoDa comparator only. No separate substantive, peer, or editorial review has been conducted."
